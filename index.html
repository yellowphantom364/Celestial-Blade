<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Celestial Blade: Echoes of the Eclipse — A 16-bit dark-celestial 2D action-platformer featuring 4-directional blade combat, aerial pogo bounces, Soul Focus healing, and a multi-phase boss encounter."
  />
  <title>Celestial Blade — Echoes of the Eclipse</title>
  <link rel="stylesheet" href="./css/main.css" />
</head>
<body>
  <main class="app-shell">
    <div id="viewport-frame" class="viewport-frame">
      <canvas id="game" width="320" height="180" tabindex="0"></canvas>
    </div>

    <footer class="status-bar" aria-label="Controls and display options">
      <div class="status-bar__left">
        <span class="status-pill"><kbd>Arrows</kbd>/<kbd>WASD</kbd> Move</span>
        <span class="status-pill"><kbd>Z</kbd>/<kbd>Space</kbd> Jump</span>
        <span class="status-pill"><kbd>X</kbd>/<kbd>J</kbd> 3-Hit Slash</span>
        <span class="status-pill"><kbd>C</kbd>/<kbd>Shift</kbd> Dash</span>
        <span class="status-pill"><kbd>Tap V/F</kbd> Wave</span>
        <span class="status-pill"><kbd>Hold V/F</kbd> Focus Heal</span>
        <span class="status-pill"><kbd>Esc</kbd> Pause</span>
      </div>
      <div class="status-bar__right">
        <button id="btn-mute" class="status-btn" type="button">AUDIO: ON [M]</button>
        <button id="btn-crt" class="status-btn" type="button">CRT: OFF [T]</button>
        <button id="btn-fullscreen" class="status-btn" type="button">FULLSCREEN</button>
      </div>
    </footer>
  </main>

  <script>
    // Use native ES6 modules over HTTP/HTTPS; fallback to compiled bundle on direct file:// open
    if (window.location.protocol === "file:") {
      const s = document.createElement("script");
      s.src = "./dist/bundle.js";
      document.body.appendChild(s);
    }
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
